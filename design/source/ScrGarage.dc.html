<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 47px; height: 52px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScrProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600">Garage</h1>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 99px; bottom: 84px; overflow-y: auto">
    <div style="box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{cars}}" as="car" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="width: 64px; height: 64px; flex: none; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}">
              <svg width="30" height="48" viewBox="0 0 64 88" aria-hidden="true"><rect x="10" y="4" width="44" height="80" rx="18" fill="{{car.color}}" stroke="{{c.line}}" stroke-width="2"></rect><rect x="16" y="20" width="32" height="16" rx="6" fill="{{c.bg}}" fill-opacity="0.75"></rect><rect x="16" y="58" width="32" height="12" rx="5" fill="{{c.bg}}" fill-opacity="0.75"></rect></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600">{{car.name}}</span>
                <sc-if value="{{car.isDefault}}" hint-placeholder-val="{{ true }}"><span style="height: 24px; padding: 0 8px; border-radius: 12px; display: flex; align-items: center; background: {{c.accentFill}}; color: {{c.onAccent}}; font-size: 12px; font-weight: 700">Default</span></sc-if>
              </span>
              <span style="font-size: 14px; color: {{c.muted}}">{{car.desc}}</span>
            </span>
            <a href="ScrAddCar.dc.html" aria-label="Edit {{car.name}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.muted}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid {{c.line}}">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">DISTANCE</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{car.km}} <span style="font-family: 'Manrope', sans-serif; font-size: 12px; color: {{c.muted}}">km</span></span></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">DRIVES</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{car.drives}}</span></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">AVG SMOOTH</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{car.smooth}}</span></span>
          </div>
        </div>
      </sc-for>
      <a href="ScrAddCar.dc.html" style="height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed {{c.muted}}; font-size: 16px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Add a car
      </a>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="KitTabBar" active="profile" mode="{{mode}}" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', accentFill: '#FFC20E', onAccent: '#0E0E0E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', accentFill: '#FFC20E', onAccent: '#0A0A0A' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    return {
      c: this.pal(light),
      mode: light ? 'light' : 'dark',
      cars: [
        { name: 'Daily driver', desc: 'Sport yellow · hatchback', color: '#FFC20E', isDefault: true, km: '962', drives: 49, smooth: 87 },
        { name: 'Weekend car', desc: 'Racing red · coupe', color: '#C62828', isDefault: false, km: '322', drives: 14, smooth: 82 }
      ]
    };
  }
}
</script>
</body>
</html>
