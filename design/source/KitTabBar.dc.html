<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava bottom tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<nav aria-label="Main" style="position: relative; width: 390px; height: 84px; box-sizing: border-box; padding: 0 8px 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: {{c.surface}}; border-top: 1px solid {{c.line}}; font-family: 'Manrope', sans-serif">
  <a href="ScrFeed.dc.html" style="{{s.feed}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9h10"></path><path d="M7 13h10"></path><path d="M7 17h6"></path></svg>
    <span>Feed</span>
  </a>
  <a href="ScrExploreMap.dc.html" style="{{s.map}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
    <span>Map</span>
  </a>
  <a href="ScrPreDrive.dc.html" aria-label="Record a drive" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; height: 50px; color: {{c.text}}; font-size: 12px; font-weight: 700">
    <span style="width: 56px; height: 56px; margin-top: -24px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: {{c.accentFill}}; color: {{c.onAccent}}; box-shadow: 0 0 0 4px {{c.surface}}, 0 6px 16px rgba(0,0,0,0.35)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6"></path><path d="M14.5 10.5h6"></path><path d="M12 14.5V21"></path></svg>
    </span>
    <span>Record</span>
  </a>
  <a href="ScrLeaderboards.dc.html" style="{{s.leaderboards}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 6h3v1a4 4 0 0 1-3 4"></path><path d="M7 6H4v1a4 4 0 0 0 3 4"></path></svg>
    <span>Ranks</span>
  </a>
  <a href="ScrProfile.dc.html" style="{{s.profile}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
    <span>Profile</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["feed","map","leaderboards","profile","none"],"default":"feed"},"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  pal(light) {
    if (light) return { surface: '#FFFFFF', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primaryText: '#0E0E0E', accentFill: '#FFC20E', onAccent: '#0E0E0E' };
    return { surface: '#141414', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primaryText: '#FFC20E', accentFill: '#FFC20E', onAccent: '#0A0A0A' };
  }
  renderVals() {
    const c = this.pal(this.props.mode === 'light');
    const act = this.props.active || 'feed';
    const item = (k) => 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 50px; font-size: 12px; ' + (act === k ? 'font-weight: 700; color: ' + c.primaryText : 'font-weight: 600; color: ' + c.muted);
    return { c: c, s: { feed: item('feed'), map: item('map'), leaderboards: item('leaderboards'), profile: item('profile') } };
  }
}
</script>
</body>
</html>
