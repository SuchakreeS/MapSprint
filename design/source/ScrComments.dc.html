<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava comments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:0.6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 16px; right: 16px; top: 99px; height: 220px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}" aria-hidden="true"></div>
  <a href="ScrDriveDetail.dc.html" aria-label="Close comments" style="position: absolute; inset: 0; background: {{c.scrim}}"></a>
  <section aria-label="Comments" style="position: absolute; left: 0; right: 0; bottom: 0; top: 160px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: {{c.surface}}; border-top: 1px solid {{c.line}}; display: flex; flex-direction: column">
    <div style="padding: 10px 8px 0 20px; display: flex; flex-direction: column">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: {{c.line}}; align-self: center" aria-hidden="true"></div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600">Comments · 3</h1>
        <a href="ScrDriveDetail.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
      </div>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{comments}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; font-size: 14px; font-weight: 700">{{m.initial}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 14px; font-weight: 700">{{m.name}} <span style="font-weight: 500; color: {{c.muted}}">· {{m.when}}</span></span>
            <span style="font-size: 15px; line-height: 1.5">{{m.text}}</span>
          </span>
        </div>
      </sc-for>
    </div>
    <div style="box-sizing: border-box; padding: 10px 12px 42px 16px; display: flex; align-items: center; gap: 8px; border-top: 1px solid {{c.line}}">
      <input type="text" aria-label="Write a comment" placeholder="Write a comment…" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 24px; background: {{c.surface2}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
      <button type="button" aria-label="Send comment" style="width: 48px; height: 48px; flex: none; border-radius: 24px; border: none; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', scrim: 'rgba(14,14,14,0.45)' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', scrim: 'rgba(0,0,0,0.6)' };
  }
  renderVals() {
    return {
      c: this.pal(this.props.mode === 'light'),
      comments: [
        { initial: 'P', name: 'Ploy', when: '1h', text: 'Nice loop! Try Lat Phrao next, it’s still dark on my map too.' },
        { initial: 'B', name: 'Beam', when: '45m', text: 'That smooth score though. Teach me.' },
        { initial: 'M', name: 'Mint', when: '20m', text: 'Ha, the trick is leaving early before the traffic. Lat Phrao this weekend?' }
      ]
    };
  }
}
</script>
</body>
</html>
