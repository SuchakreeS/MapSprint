<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava add your car</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:0.55}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 55px 24px 42px; display: flex; flex-direction: column; gap: 20px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="ScrProfileSetup.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 13px; font-weight: 700; color: {{c.muted}}">Step 5 of 6</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.line}}"></span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.2">Add your car</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">Its colour becomes your car icon on the map. You can add more cars later.</p>
  </div>
  <div style="height: 104px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{c.surface}}; border: 1px solid {{c.line}}">
    <svg width="64" height="88" viewBox="0 0 64 88" aria-hidden="true"><rect x="10" y="4" width="44" height="80" rx="18" fill="{{carColor}}" stroke="{{c.line}}" stroke-width="1.5"></rect><rect x="16" y="20" width="32" height="16" rx="6" fill="{{c.bg}}" fill-opacity="0.75"></rect><rect x="16" y="58" width="32" height="12" rx="5" fill="{{c.bg}}" fill-opacity="0.75"></rect></svg>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ac-nick" style="font-size: 14px; font-weight: 700">Nickname</label>
      <input id="ac-nick" type="text" value="Daily driver" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ac-make" style="font-size: 14px; font-weight: 700">Make</label>
        <input id="ac-make" type="text" placeholder="e.g. your brand" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px; min-width: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ac-model" style="font-size: 14px; font-weight: 700">Model</label>
        <input id="ac-model" type="text" placeholder="e.g. hatchback" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px; min-width: 0">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700">Colour · <span style="font-weight: 600; color: {{c.muted}}">{{colorName}}</span></span>
      <div role="radiogroup" aria-label="Car colour" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="8">
          <button type="button" role="radio" aria-checked="{{sw.on}}" aria-label="{{sw.name}}" onClick="{{sw.pick}}" style="{{sw.style}}"><span style="{{sw.dot}}"></span></button>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
    <a href="ScrPrivacyZones.dc.html" style="height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 700">Continue</a>
    <a href="ScrPrivacyZones.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: {{c.muted}}">Skip for now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { color: 4 };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', progress: '#0E0E0E', ring: '#0E0E0E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', progress: '#FFC20E', ring: '#FFC20E' };
  }
  renderVals() {
    const c = this.pal(this.props.mode === 'light');
    const cols = [['Pearl white', '#F2F0EB'], ['Onyx black', '#151515'], ['Silver', '#B8B8B8'], ['Gunmetal', '#4A4F55'], ['Sport yellow', '#FFC20E'], ['Racing red', '#C62828'], ['Deep blue', '#1F3A93'], ['Forest green', '#1E4D2B']];
    const sel = this.state.color;
    return {
      c: c,
      carColor: cols[sel][1],
      colorName: cols[sel][0],
      swatches: cols.map((x, i) => ({
        name: x[0],
        on: i === sel,
        style: 'height: 44px; padding: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid ' + (i === sel ? c.ring : 'transparent'),
        dot: 'display: block; width: 30px; height: 30px; border-radius: 15px; background: ' + x[1] + '; border: 1px solid ' + c.line,
        pick: () => this.setState({ color: i })
      }))
    };
  }
}
</script>
</body>
</html>
