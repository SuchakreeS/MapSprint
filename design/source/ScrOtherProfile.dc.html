<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava other profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 47px; height: 52px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="ScrFeed.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" aria-label="More options, including block and report" style="width: 44px; height: 44px; border: none; background: none; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 99px; bottom: 84px; overflow-y: auto">
    <div style="box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span style="width: 96px; height: 96px; border-radius: 48px; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; border: 2px solid {{c.gold}}; font-family: 'Sora', sans-serif; font-size: 36px; font-weight: 600">M</span>
        <span style="font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 600">Mint</span>
        <span style="font-size: 14px; color: {{c.muted}}">@mint.loops · Bangkok</span>
        <span style="display: flex; gap: 8px; align-items: center"><span style="height: 28px; padding: 0 10px; border-radius: 14px; display: flex; align-items: center; background: {{c.accentFill}}; color: {{c.onAccent}}; font-size: 13px; font-weight: 700">Level 12</span><span style="font-size: 14px; color: {{c.muted}}"><span style="font-weight: 700; color: {{c.text}}">210</span> followers</span></span>
      </div>
      <button type="button" aria-pressed="{{following}}" onClick="{{toggle}}" style="{{followStyle}}">{{followLabel}}</button>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <span style="padding: 12px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">DISTANCE</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700">2,904 <span style="font-family: 'Manrope', sans-serif; font-size: 12px; color: {{c.muted}}">km</span></span></span>
        <span style="padding: 12px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">DRIVES</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700">118</span></span>
        <span style="padding: 12px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{c.muted}}">CELLS</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700">2,610</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0; padding: 8px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: {{c.muted}}">RECENT DRIVES</h2>
        <a href="ScrDriveDetail.dc.html" style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Late dinner loop around Ari</span><span style="font-size: 13px; color: {{c.muted}}">Today · 23.6 km · 18 new cells</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="ScrDriveDetail.dc.html" style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Sunday market run</span><span style="font-size: 13px; color: {{c.muted}}">Sun 1 Nov · 31.2 km · 24 new cells</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="KitTabBar" active="feed" mode="{{mode}}" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { following: false };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', accentFill: '#FFC20E', onAccent: '#0E0E0E', gold: '#7A5F1E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', accentFill: '#FFC20E', onAccent: '#0A0A0A', gold: '#C9B37E' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const f = this.state.following;
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      following: f,
      followLabel: f ? 'Following' : 'Follow',
      followStyle: 'height: 52px; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 700; ' + (f ? 'background: ' + c.surface2 + '; color: ' + c.text + '; border: 1px solid ' + c.line : 'background: ' + c.primary + '; color: ' + c.onPrimary + '; border: none'),
      toggle: () => this.setState({ following: !f })
    };
  }
}
</script>
</body>
</html>
