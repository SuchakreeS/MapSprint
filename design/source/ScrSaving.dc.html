<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava saving drive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 55px 24px 42px; display: flex; flex-direction: column; align-items: center; gap: 28px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: relative; width: 168px; height: 168px; margin-top: 64px">
    <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <circle cx="84" cy="84" r="74" fill="none" stroke="{{c.line}}" stroke-width="8"></circle>
      <circle cx="84" cy="84" r="74" fill="none" stroke="{{c.ring}}" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 84 84)"></circle>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 52px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Rajdhani', sans-serif; font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">70%</span>
      <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">uploading</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 600">Saving your drive</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">Checking your track and adding up your XP.</p>
  </div>
  <div role="list" aria-label="Progress" style="align-self: stretch; display: flex; flex-direction: column; padding: 4px 16px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.line}}">
    <div role="listitem" style="height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.success}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Track cleaned</span><span style="font-size: 13px; color: {{c.muted}}">Done</span>
    </div>
    <div role="listitem" style="height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.success}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Speed and distance</span><span style="font-size: 13px; color: {{c.muted}}">Done</span>
    </div>
    <div role="listitem" style="height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.ring}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 600">XP and badges</span><span style="font-size: 13px; color: {{c.muted}}">Working…</span>
    </div>
    <div role="listitem" style="height: 52px; display: flex; align-items: center; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 600; color: {{c.muted}}">Map cells</span><span style="font-size: 13px; color: {{c.muted}}">Waiting</span>
    </div>
  </div>
  <div style="align-self: stretch; display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{c.surface2}}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.gold}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg>
    <span style="font-size: 13px; line-height: 1.5; color: {{c.muted}}">No signal? Your drive is safe on your phone and uploads by itself when you're back online.</span>
  </div>
  <a href="Recap2.dc.html" style="margin-top: auto; height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: {{c.muted}}">Open recap when ready</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', ring: '#0E0E0E', gold: '#7A5F1E', success: '#1E7F45' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', ring: '#FFC20E', gold: '#C9B37E', success: '#5BD48A' };
  }
  renderVals() {
    return { c: this.pal(this.props.mode === 'light') };
  }
}
</script>
</body>
</html>
