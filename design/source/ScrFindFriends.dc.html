<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava find friends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:0.6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 47px; height: 52px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScrFeed.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600">Find friends</h1>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 99px; bottom: 84px; overflow-y: auto">
    <div style="box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ff-search" style="font-size: 14px; font-weight: 700">Search by username</label>
        <div style="position: relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 16px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input id="ff-search" type="search" placeholder="@username" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 44px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
        </div>
      </div>
      <button type="button" style="min-height: 64px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: inherit; text-align: left">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{c.accentFill}}; color: {{c.onAccent}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Invite friends</span><span style="font-size: 13px; color: {{c.muted}}">Share your invite link on LINE or anywhere</span></span>
      </button>
      <span style="padding-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: {{c.muted}}">SUGGESTED FOR YOU</span>
      <sc-for list="{{people}}" as="u" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
          <a href="ScrOtherProfile.dc.html" style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0">
            <span style="width: 48px; height: 48px; flex: none; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; border: 1.5px solid {{c.gold}}; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 18px">{{u.initial}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 700">{{u.name}} <span style="font-weight: 500; color: {{c.muted}}">@{{u.handle}}</span></span><span style="font-size: 13px; color: {{c.muted}}">LV {{u.level}} · {{u.mutual}}</span></span>
          </a>
          <button type="button" aria-pressed="{{u.on}}" onClick="{{u.toggle}}" style="{{u.style}}">{{u.label}}</button>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="KitTabBar" active="feed" mode="{{mode}}" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { following: [false, true, false, false] };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', accentFill: '#FFC20E', onAccent: '#0E0E0E', gold: '#7A5F1E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', accentFill: '#FFC20E', onAccent: '#0A0A0A', gold: '#C9B37E' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const f = this.state.following;
    const ppl = [
      { initial: 'F', name: 'Fah', handle: 'fah.cruise', level: 15, mutual: '4 mutual friends' },
      { initial: 'T', name: 'Toey', handle: 'toey_gt', level: 7, mutual: '2 mutual friends' },
      { initial: 'K', name: 'Kan', handle: 'kan.explores', level: 21, mutual: 'Pathum Thani' },
      { initial: 'O', name: 'Oil', handle: 'oil_nightdrive', level: 4, mutual: '1 mutual friend' }
    ];
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      people: ppl.map((p, i) => Object.assign({}, p, {
        on: f[i],
        label: f[i] ? 'Following' : 'Follow',
        style: 'height: 40px; min-width: 96px; padding: 0 14px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 700; ' + (f[i] ? 'background: ' + c.surface2 + '; color: ' + c.text + '; border: 1px solid ' + c.line : 'background: ' + c.primary + '; color: ' + c.onPrimary + '; border: none'),
        toggle: () => { const n = f.slice(); n[i] = !n[i]; this.setState({ following: n }); }
      }))
    };
  }
}
</script>
</body>
</html>
