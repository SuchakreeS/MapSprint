<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava privacy settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 47px; height: 52px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScrSettings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600">Privacy</h1>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 99px; bottom: 84px; overflow-y: auto">
    <div style="box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px">
      <div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.line}}">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
          <div style="{{t.row}}">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{t.label}}</span><span style="font-size: 13px; line-height: 1.4; color: {{c.muted}}">{{t.sub}}</span></span>
            <button type="button" role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="{{t.sw}}"><span style="{{t.knob}}"></span></button>
          </div>
        </sc-for>
      </div>
      <div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.line}}; margin-top: 8px">
        <a href="#visibility" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Default drive visibility</span><span style="font-size: 13px; color: {{c.muted}}">Followers</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="ScrPrivacyZones.dc.html" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Privacy zones</span><span style="font-size: 13px; color: {{c.muted}}">Home · 300 m</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="#blocked" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Blocked people</span><span style="font-size: 13px; color: {{c.muted}}">None</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="KitTabBar" active="profile" mode="{{mode}}" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [false, false] };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', switchOn: '#0E0E0E', knobOn: '#FFC20E' };
    return { bg: '#0A0A0A', surface: '#141414', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', switchOn: '#FFC20E', knobOn: '#0A0A0A' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const on = this.state.on;
    const items = [
      ['Private account', 'New followers need your approval to see your drives.'],
      ['Share max speed', 'Off by default. Max speed is never ranked or scored.']
    ];
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      toggles: items.map((it, i) => ({
        label: it[0], sub: it[1], on: on[i],
        row: 'min-height: 72px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;' + (i === 0 ? ' border-bottom: 1px solid ' + c.line : ''),
        sw: 'position: relative; flex: none; width: 52px; height: 32px; padding: 0; border-radius: 16px; border: none; background: ' + (on[i] ? c.switchOn : c.line),
        knob: 'position: absolute; top: 4px; left: ' + (on[i] ? '24px' : '4px') + '; width: 24px; height: 24px; border-radius: 12px; background: ' + (on[i] ? c.knobOn : c.muted) + '; transition: left 180ms ease-out',
        flip: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); }
      }))
    };
  }
}
</script>
</body>
</html>
