<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava share drive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:0.55}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 110px; overflow-y: auto; box-sizing: border-box; padding: 47px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 4px; height: 52px">
      <a href="Recap2.dc.html" aria-label="Back to recap" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600">Share drive</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="sd-title" style="font-size: 14px; font-weight: 700">Title</label>
      <input id="sd-title" type="text" value="Morning loop to Bang Kapi" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.muted}}">PREVIEW</span>
      <svg width="332" height="120" viewBox="0 0 332 120" aria-hidden="true" style="display: block; border-radius: 12px">
        <defs><pattern id="sd-grid-{{mode}}" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0 H0 V12" fill="none" stroke="{{c.bpLine}}" stroke-width="0.5" opacity="0.28"></path></pattern></defs>
        <rect x="0" y="0" width="332" height="120" rx="12" fill="{{c.bg}}"></rect>
        <rect x="0" y="0" width="332" height="120" fill="url(#sd-grid-{{mode}})"></rect>
        <path d="M40 96 L90 96 L90 52 L170 52 L170 80 L250 80 L250 28 L296 28" fill="none" stroke="{{c.explored}}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M40 96 L90 96 L90 52 L170 52 L170 80 L250 80 L250 28 L296 28" fill="none" stroke="{{c.route}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="40" cy="96" r="14" fill="none" stroke="{{c.gold}}" stroke-width="1.2" stroke-dasharray="3 3"></circle>
      </svg>
      <div style="display: flex; gap: 16px; font-size: 13px; color: {{c.muted}}">
        <span><span style="font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: {{c.text}}">18.4</span> km</span>
        <span><span style="font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: {{c.text}}">42.1</span> km/h avg</span>
        <span><span style="font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: {{c.text}}">+728</span> XP</span>
      </div>
    </div>
    <div role="radiogroup" aria-label="Who can see this drive" style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700">Who can see it</span>
      <sc-for list="{{vis}}" as="v" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">
          <span style="{{v.dot}}"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 700">{{v.label}}</span><span style="font-size: 13px; color: {{c.muted}}">{{v.sub}}</span></span>
        </button>
      </sc-for>
    </div>
    <div style="min-height: 56px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Hide start and finish</span><span style="font-size: 13px; color: {{c.muted}}">Uses your privacy zones</span></span>
      <button type="button" role="switch" aria-checked="{{hide}}" aria-label="Hide start and finish" onClick="{{toggleHide}}" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; box-sizing: border-box; padding: 12px 16px 42px; background: {{c.bg}}; border-top: 1px solid {{c.line}}">
    <a href="ScrFeed.dc.html" style="height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 700">Post to feed</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vis: 0, hide: true };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', gold: '#7A5F1E', bpLine: '#5C5850', explored: '#E6E2D9', route: '#0E0E0E', ring: '#0E0E0E', switchOn: '#0E0E0E', knobOn: '#FFC20E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', gold: '#C9B37E', bpLine: '#A8A49A', explored: '#1E1E1E', route: '#FFC20E', ring: '#FFC20E', switchOn: '#FFC20E', knobOn: '#0A0A0A' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const s = this.state;
    const opts = [['Followers', 'People who follow you'], ['Everyone', 'Shows on your public profile'], ['Only me', 'Saved to your history only']];
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      hide: s.hide,
      vis: opts.map((o, i) => ({
        label: o[0],
        sub: o[1],
        on: i === s.vis,
        style: 'min-height: 64px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border-radius: 16px; font-family: inherit; color: ' + c.text + '; background: ' + c.surface + '; border: ' + (i === s.vis ? '2px solid ' + c.ring : '1px solid ' + c.line),
        dot: 'width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 10px; border: ' + (i === s.vis ? '6px solid ' + c.ring : '2px solid ' + c.muted),
        pick: () => this.setState({ vis: i })
      })),
      switchStyle: 'position: relative; flex: none; width: 52px; height: 32px; padding: 0; border-radius: 16px; border: none; background: ' + (s.hide ? c.switchOn : c.line),
      knobStyle: 'position: absolute; top: 4px; left: ' + (s.hide ? '24px' : '4px') + '; width: 24px; height: 24px; border-radius: 12px; background: ' + (s.hide ? c.knobOn : c.muted) + '; transition: left 180ms ease-out',
      toggleHide: () => this.setState({ hide: !s.hide })
    };
  }
}
</script>
</body>
</html>
