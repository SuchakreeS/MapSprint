<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava privacy zones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 55px 24px 42px; display: flex; flex-direction: column; gap: 18px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="ScrAddCar.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 13px; font-weight: 700; color: {{c.muted}}">Step 6 of 6</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span><span style="height: 4px; border-radius: 2px; background: {{c.progress}}"></span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.2">Hide your home and work</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">Any part of a drive inside these circles is hidden from everyone else.</p>
  </div>
  <div style="height: 200px; flex: none; border-radius: 20px; overflow: hidden; border: 1px solid {{c.line}}">
    <svg width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="Map showing the home zone set and no work zone yet" style="display: block">
      <defs><pattern id="pz-grid-{{mode}}" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0 H0 V16" fill="none" stroke="{{c.bpLine}}" stroke-width="0.5" opacity="0.28"></path></pattern></defs>
      <rect x="0" y="0" width="340" height="200" fill="{{c.bg}}"></rect>
      <rect x="0" y="0" width="340" height="200" fill="url(#pz-grid-{{mode}})"></rect>
      <path d="M0 60 H340 M0 140 H340 M70 0 V200 M180 0 V200 M270 0 V200" fill="none" stroke="{{c.bpLine}}" stroke-width="1" opacity="0.5"></path>
      <circle cx="120" cy="110" r="48" fill="{{c.accentFill}}" fill-opacity="0.14" stroke="{{c.gold}}" stroke-width="1.5" stroke-dasharray="5 4"></circle>
      <circle cx="120" cy="110" r="16" fill="{{c.accentFill}}"></circle>
      <path d="M113 112l7-6 7 6v6h-14z" fill="none" stroke="{{c.onAccent}}" stroke-width="1.8" stroke-linejoin="round"></path>
      <text x="120" y="176" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="700" fill="{{c.text}}">Home</text>
    </svg>
  </div>
  <div style="display: flex; flex-direction: column; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.line}}">
    <a href="#home" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.line}}">
      <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{c.accentFill}}; color: {{c.onAccent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Home</span><span style="font-size: 13px; color: {{c.muted}}">Set · {{radiusLabel}} radius</span></span>
      <span style="font-size: 14px; font-weight: 700; color: {{c.muted}}">Edit</span>
    </a>
    <a href="#work" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed {{c.muted}}; color: {{c.muted}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      <span style="flex: 1; font-size: 15px; font-weight: 700">Add work</span>
    </a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 700">Hidden radius</span>
    <div role="radiogroup" aria-label="Hidden radius" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: {{c.surface2}}">
      <sc-for list="{{radii}}" as="r" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
    <a href="ScrFeed.dc.html" style="height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 700">Finish setup</a>
    <a href="ScrFeed.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: {{c.muted}}">Skip for now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: 1 };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', accentFill: '#FFC20E', onAccent: '#0E0E0E', gold: '#7A5F1E', progress: '#0E0E0E', bpLine: '#5C5850' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', accentFill: '#FFC20E', onAccent: '#0A0A0A', gold: '#C9B37E', progress: '#FFC20E', bpLine: '#A8A49A' };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const labels = ['200 m', '300 m', '500 m'];
    const sel = this.state.r;
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      radiusLabel: labels[sel],
      radii: labels.map((l, i) => ({
        label: l,
        on: i === sel,
        style: 'height: 44px; border-radius: 12px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; ' + (i === sel ? 'background: ' + c.surface + '; color: ' + c.text + '; box-shadow: 0 1px 4px rgba(0,0,0,0.2)' : 'background: transparent; color: ' + c.muted),
        pick: () => this.setState({ r: i })
      }))
    };
  }
}
</script>
</body>
</html>
