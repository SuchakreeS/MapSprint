<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sport Luxe v2 driving screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{cursor:pointer;touch-action:manipulation}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <svg width="390" height="520" viewBox="0 0 390 520" role="img" aria-label="Map of your drive. Areas you have driven are filled in; unexplored areas show as a blueprint." style="position: absolute; left: 0; top: 0">
    <defs>
      <pattern id="h2-grid-{{mode}}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 H0 V20" fill="none" stroke="{{c.bpLine}}" stroke-width="0.6" opacity="0.28"></path></pattern>
      <filter id="h2-soft-{{mode}}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
      <mask id="h2-mask-{{mode}}" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="520">
        <rect x="0" y="0" width="390" height="520" fill="#000000"></rect>
        <g filter="url(#h2-soft-{{mode}})">
          <path d="{{map.route}}" fill="none" stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{map.old}}" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="320" cy="330" r="56" fill="#FFFFFF"></circle>
        </g>
      </mask>
    </defs>
    <rect x="0" y="0" width="390" height="520" fill="{{c.bp}}"></rect>
    <rect x="0" y="0" width="390" height="520" fill="url(#h2-grid-{{mode}})"></rect>
    <path d="{{map.roads}}" fill="none" stroke="{{c.bpLine}}" stroke-width="1" opacity="0.55"></path>
    <path d="{{map.express}}" fill="none" stroke="{{c.bpLine}}" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"></path>
    <g mask="url(#h2-mask-{{mode}})">
      <rect x="0" y="0" width="390" height="520" fill="{{c.explored}}"></rect>
      <path d="{{map.roads}}" fill="none" stroke="{{c.road}}" stroke-opacity="{{c.roadOp}}" stroke-width="8" stroke-linecap="round"></path>
      <path d="{{map.express}}" fill="none" stroke="{{c.express}}" stroke-width="10" stroke-linecap="round" opacity="0.85"></path>
    </g>
    <path d="{{map.route}}" fill="none" stroke="{{c.route}}" stroke-opacity="0.18" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="{{map.route}}" fill="none" stroke="{{c.route}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="195" cy="320" r="30" fill="{{c.route}}" fill-opacity="0.16"></circle>
    <path d="M195 302 L208 333 L195 325 L182 333 Z" fill="{{c.route}}" stroke="{{c.bg}}" stroke-width="2.5" stroke-linejoin="round"></path>
  </svg>

  <div style="position: absolute; left: 16px; right: 16px; top: 55px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}">
      <div style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: {{c.accentFill}}; color: {{c.onAccent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em">LV</span>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">7</span>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <span style="font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600">Level 7</span>
          <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}; font-variant-numeric: tabular-nums">2,030 / 2,263 XP</span>
        </div>
        <div style="display: flex; gap: 4px" aria-hidden="true">
          <sc-for list="{{leds}}" as="led" hint-placeholder-count="12">
            <div style="{{led.style}}"></div>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.gold}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
        <span style="font-size: 14px; font-weight: 600">Bang Kapi</span>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{c.primaryText}}">34%</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.gold}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path></svg>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{c.primaryText}}">+9</span>
        <span style="font-size: 14px; font-weight: 600">new cells</span>
      </div>
    </div>
  </div>

  <button type="button" aria-label="Recenter map on your car" style="position: absolute; right: 16px; top: 398px; width: 48px; height: 48px; padding: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}; color: {{c.text}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>
  </button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 382px; box-sizing: border-box; padding: 10px 20px 42px; border-radius: 28px 28px 0 0; background: {{c.surface}}; border-top: 1px solid {{c.line}}; box-shadow: 0 -8px 32px rgba(0,0,0,0.25); display: flex; flex-direction: column">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: {{c.line}}; align-self: center" aria-hidden="true"></div>
    <div style="position: relative; width: 240px; height: 164px; flex: none; align-self: center; margin-top: 8px">
      <svg width="240" height="164" viewBox="0 0 240 164" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <path d="M36.86 160 A96 96 0 1 1 203.14 160" fill="none" stroke="{{c.line}}" stroke-width="8" stroke-linecap="round"></path>
        <path d="M36.86 160 A96 96 0 1 1 203.14 160" fill="none" stroke="{{c.redline}}" stroke-width="8" pathLength="100" stroke-dasharray="0 85 15 0" opacity="0.5"></path>
        <path d="M36.86 160 A96 96 0 1 1 203.14 160" fill="none" stroke="{{c.gauge}}" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="40 100"></path>
      </svg>
      <div style="position: absolute; left: 0; right: 0; top: 40px; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 84px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums" aria-label="Speed 64 kilometres per hour">64</span>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: {{c.muted}}; margin-top: 2px">KM/H</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{c.muted}}">MOVING AVG</span>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">40.8 <span style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: {{c.muted}}">km/h</span></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid {{c.line}}; border-right: 1px solid {{c.line}}">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{c.muted}}">DISTANCE</span>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">12.7 <span style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: {{c.muted}}">km</span></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{c.muted}}">TIME</span>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">18:40</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px; margin-top: auto">
      <button type="button" style="height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{c.surface2}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect></svg>
        Pause
      </button>
      <button type="button" aria-label="Hold to finish drive" onPointerDown="{{startHold}}" onPointerUp="{{endHold}}" onPointerLeave="{{endHold}}" onPointerCancel="{{endHold}}" onClick="{{keyFinish}}" style="position: relative; overflow: hidden; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{c.primary}}; border: none; color: {{c.onPrimary}}; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; user-select: none">
        <span style="{{holdFill}}"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
        <span style="position: relative">Hold to finish</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"onStop":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hold: 0 };
    this.timer = null;
  }
  componentWillUnmount() {
    this.clearHold();
  }
  clearHold() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }
  finish() {
    const f = this.props.onStop;
    if (typeof f === 'function') f();
  }
  pal(light) {
    if (light) {
      return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', primaryText: '#0E0E0E', accentFill: '#FFC20E', onAccent: '#0E0E0E', gold: '#7A5F1E', gauge: '#0E0E0E', redline: '#C62828', leds: ['#3A3A3A', '#B58100', '#C62828'], shadow: '0 6px 20px rgba(14,14,14,0.10)', bp: '#F5F3EE', bpLine: '#5C5850', explored: '#E6E2D9', road: '#0E0E0E', roadOp: 0.14, express: '#E0A800', route: '#0E0E0E' };
    }
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', primaryText: '#FFC20E', accentFill: '#FFC20E', onAccent: '#0A0A0A', gold: '#C9B37E', gauge: '#FFC20E', redline: '#FF453A', leds: ['#E8E6E1', '#FFC20E', '#FF453A'], shadow: '0 8px 24px rgba(0,0,0,0.5)', bp: '#0A0A0A', bpLine: '#A8A49A', explored: '#171717', road: '#F5F3EE', roadOp: 0.16, express: '#FFC20E', route: '#FFC20E' };
  }
  buildMap() {
    const toD = (pts) => pts.map((q, i) => (i ? 'L' : 'M') + q[0] + ' ' + q[1]).join(' ');
    return {
      route: toD([[0, 300], [90, 300], [90, 410], [195, 410], [195, 320]]),
      old: toD([[300, 520], [300, 230], [390, 230]]),
      roads: 'M90 0 V520 M195 0 V520 M300 0 V520 M0 140 H390 M0 230 H390 M0 300 H390 M0 410 H390',
      express: 'M0 250 L390 110'
    };
  }
  renderVals() {
    const light = this.props.mode === 'light';
    const c = this.pal(light);
    const lit = 5;
    const leds = [];
    for (let i = 0; i < 12; i++) {
      const col = i < 5 ? c.leds[0] : (i < 9 ? c.leds[1] : c.leds[2]);
      leds.push({ style: 'flex: 1; height: 8px; border-radius: 2px; background: ' + (i < lit ? col : c.line) });
    }
    return {
      c: c,
      mode: light ? 'light' : 'dark',
      leds: leds,
      map: this.buildMap(),
      holdFill: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + this.state.hold + '%; background: ' + c.onPrimary + '; opacity: 0.22',
      startHold: () => {
        this.clearHold();
        this.timer = setInterval(() => {
          const n = Math.min(100, this.state.hold + 5);
          if (n >= 100) { this.clearHold(); this.setState({ hold: 0 }); this.finish(); }
          else this.setState({ hold: n });
        }, 40);
      },
      endHold: () => { this.clearHold(); if (this.state.hold) this.setState({ hold: 0 }); },
      keyFinish: (e) => { if (e && e.detail === 0) this.finish(); }
    };
  }
}
</script>
</body>
</html>
