<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartrava sign up or log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Michroma&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:0.55}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 55px 24px 42px; display: flex; flex-direction: column; gap: 24px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Manrope', sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="ScrWelcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: 'Michroma', sans-serif; font-size: 12px; letter-spacing: 0.2em; color: {{c.gold}}">CARTRAVA</span>
    <span style="width: 44px"></span>
  </div>
  <div role="tablist" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: {{c.surface2}}">
    <button type="button" role="tab" aria-selected="{{isSignup}}" onClick="{{toSignup}}" style="{{tabSignup}}">Sign up</button>
    <button type="button" role="tab" aria-selected="{{isLogin}}" onClick="{{toLogin}}" style="{{tabLogin}}">Log in</button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.2">{{heading}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">{{sub}}</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="si-email" style="font-size: 14px; font-weight: 700">Email</label>
      <input id="si-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="si-pass" style="font-size: 14px; font-weight: 700">Password</label>
      <div style="position: relative">
        <input id="si-pass" type="{{pwType}}" autocomplete="{{pwAuto}}" placeholder="••••••••" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 56px 0 16px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 16px">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: none; background: none; color: {{c.muted}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <sc-if value="{{isSignup}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 13px; color: {{c.muted}}">At least 8 characters, with one number.</span>
      </sc-if>
      <sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
        <a href="#forgot" style="align-self: flex-end; height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: {{c.text}}; text-decoration: underline">Forgot password?</a>
      </sc-if>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: auto">
    <a href="{{nextHref}}" style="height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 700">{{cta}}</a>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{c.muted}}"><span style="flex: 1; height: 1px; background: {{c.line}}"></span>or<span style="flex: 1; height: 1px; background: {{c.line}}"></span></div>
    <a href="ScrLocation.dc.html" style="height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-size: 16px; font-weight: 700">Continue with Google</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'signup', show: false };
  }
  pal(light) {
    if (light) return { bg: '#F5F3EE', surface: '#FFFFFF', surface2: '#EEEBE4', line: '#DEDAD0', text: '#0E0E0E', muted: '#5C5850', primary: '#0E0E0E', onPrimary: '#FFC20E', gold: '#7A5F1E' };
    return { bg: '#0A0A0A', surface: '#141414', surface2: '#1E1E1E', line: '#2C2C2C', text: '#F5F3EE', muted: '#A8A49A', primary: '#FFC20E', onPrimary: '#0A0A0A', gold: '#C9B37E' };
  }
  renderVals() {
    const c = this.pal(this.props.mode === 'light');
    const s = this.state;
    const signup = s.tab === 'signup';
    const tab = (on) => 'height: 44px; border-radius: 12px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; ' + (on ? 'background: ' + c.surface + '; color: ' + c.text + '; box-shadow: 0 1px 4px rgba(0,0,0,0.2)' : 'background: transparent; color: ' + c.muted);
    return {
      c: c,
      isSignup: signup,
      isLogin: !signup,
      tabSignup: tab(signup),
      tabLogin: tab(!signup),
      heading: signup ? 'Create your account' : 'Welcome back',
      sub: signup ? 'Your drives, map and badges sync across your phones.' : 'Log in to pick up where you left off.',
      cta: signup ? 'Create account' : 'Log in',
      nextHref: signup ? 'ScrLocation.dc.html' : 'ScrFeed.dc.html',
      pwType: s.show ? 'text' : 'password',
      pwAuto: signup ? 'new-password' : 'current-password',
      pwLabel: s.show ? 'Hide password' : 'Show password',
      toSignup: () => this.setState({ tab: 'signup' }),
      toLogin: () => this.setState({ tab: 'login' }),
      togglePw: () => this.setState({ show: !s.show })
    };
  }
}
</script>
</body>
</html>
